name: Runner Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: System info
        run: |
          echo "=== sw_vers ==="; sw_vers
          echo "=== CPU ==="; sysctl -n machdep.cpu.brand_string; echo "ncpu:"; sysctl -n hw.ncpu; echo "physicalcpu:"; sysctl -n hw.physicalcpu
          echo "=== RAM bytes ==="; sysctl -n hw.memsize
          echo "=== uname ==="; uname -a
      - name: Disk space
        run: |
          echo "=== df -h ==="; df -h
          echo "=== home df ==="; df -h "$HOME"
      - name: Xcode and Metal
        run: |
          echo "=== xcode-select ==="; xcode-select -p
          echo "=== xcodebuild ==="; xcodebuild -version || true
          echo "=== installed Xcodes ==="; ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "=== find metal ==="; xcrun --find metal || echo "metal NOT FOUND"
          echo "=== toolchains dir ==="; ls /Library/Developer/Toolchains 2>/dev/null || echo "no /Library/Developer/Toolchains"
      - name: Tools
        run: |
          brew --version 2>/dev/null | head -1 || echo "no brew"
          dotnet --version 2>/dev/null || echo "no dotnet"
          python3 --version || true
          echo "paths:"; which zstd spirv-cross 7z xcodegen 2>/dev/null || echo "some tools missing (expected)"
      - name: Disk write speed 2GiB
        run: |
          dd if=/dev/zero of="$HOME/probe.bin" bs=1m count=2048 2>&1 | tail -1
          rm -f "$HOME/probe.bin"
      - name: Network egress quick check
        run: |
          curl -s -o /dev/null -w "cloudflare 25MB: %{speed_download} B/s in %{time_total}s\n" "https://speed.cloudflare.com/__down?bytes=25000000" || echo "network check failed"
