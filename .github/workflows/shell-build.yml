name: Build game-free iOS shell
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release after the build and audits pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: official-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  shell:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and publication target
        env:
          SHOULD_PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          python3 - <<'PY'
          import json,os,re
          v=json.load(open('config/version.json'))
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+){2}',v['version'])
          tag='v'+v['version']
          if os.environ['GITHUB_REF_TYPE']=='tag':assert os.environ['GITHUB_REF_NAME']==tag
          elif os.environ['SHOULD_PUBLISH']=='true':assert os.environ['GITHUB_REF_NAME']=='main','Publish from main only'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('RELEASE_TAG='+tag+'\nAPP_VERSION='+v['version']+'\nAPP_BUILD='+str(v['build'])+'\n')
          PY
      - name: Audit source and test packaging
        run: |
          python tools/audit_release.py .
          python tools/test_shell.py
          python tools/test_one_click.py
          python tools/test_prepare_game.py
          python tools/test_launcher.py
          python tools/test_own_compilers.py
      - name: Install project generator
        run: brew install xcodegen
      - name: Build official Metal 4 shell without game files
        run: python tools/build_shell.py --work "$RUNNER_TEMP/shell-work" --output "$RUNNER_TEMP/shell-output"
      - name: Verify exact IPA contents, metadata and Metal 4 build
        run: python tools/verify_shell.py "$RUNNER_TEMP/shell-output"
      - uses: actions/upload-artifact@v4
        with:
          name: ACNHMobile-iOS26-v${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}-shell
          path: ${{ runner.temp }}/shell-output/*
          if-no-files-found: error
      - name: Publish verified shell from main
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/shell-output/* \
            --target "$(git rev-parse HEAD)" --draft \
            --title "ACNH Mobile $RELEASE_TAG · 官方 Metal 4 空壳" \
            --notes-file "docs/RELEASE-$RELEASE_TAG.zh-CN.md"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/remote-shell"
          python tools/verify_shell.py "$RUNNER_TEMP/remote-shell"
          gh release edit "$RELEASE_TAG" --draft=false --latest
