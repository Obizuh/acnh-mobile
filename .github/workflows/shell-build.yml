name: Build game-free iOS shell
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build and publish; leave both tag fields empty for artifact only'
        required: false
        type: string
      new_release_tag:
        description: 'New v* tag to create and publish from the selected branch'
        required: false
        type: string
      release_notes:
        description: 'Optional notes describing fixes in this release'
        required: false
        type: string
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: shell-release-${{ inputs.new_release_tag || inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  shell:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.new_release_tag || inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          NEW_RELEASE_TAG: ${{ inputs.new_release_tag }}
          EXISTING_RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || inputs.release_tag != '' || inputs.new_release_tag != '' }}
        run: |
          python3 - <<'PYTHON'
          import os,re,subprocess
          if os.environ['PUBLISH']=='true' and not re.fullmatch(r'v[0-9][0-9A-Za-z._-]{0,100}',os.environ['RELEASE_TAG']):
              raise SystemExit('Release tags must start with v and a number, and contain only letters, digits, dots, hyphens or underscores.')
          if os.environ['NEW_RELEASE_TAG']:
              if os.environ['EXISTING_RELEASE_TAG']:
                  raise SystemExit('Choose either release_tag or new_release_tag, not both.')
              remote=subprocess.check_output(['git','ls-remote','--tags','https://github.com/'+os.environ['GITHUB_REPOSITORY']+'.git','refs/tags/'+os.environ['NEW_RELEASE_TAG']],text=True)
              if remote.strip():
                  raise SystemExit('The new tag already exists; use release_tag instead.')
          PYTHON
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public sources
        run: python tools/audit_release.py .
      - name: Test shell packaging
        run: python tools/test_shell.py
      - name: Install project generator
        run: brew install xcodegen
      - name: Build shell without game files or signing secrets
        run: python tools/build_shell.py --work "$RUNNER_TEMP/acnh-shell" --output "$RUNNER_TEMP/shell-output"
      - uses: actions/upload-artifact@v4
        with:
          name: ACNHMobile-shell-build-input
          path: ${{ runner.temp }}/shell-output/*
          if-no-files-found: error
      - name: Publish release with complete shell assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || inputs.release_tag != '' || inputs.new_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          NEW_RELEASE_TAG: ${{ inputs.new_release_tag }}
          RELEASE_TAG: ${{ inputs.new_release_tag || inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/shell-output/ACNHMobile-shell-build-input.zip"
          test -s "$RUNNER_TEMP/shell-output/shell-audit.json"
          test -s "$RUNNER_TEMP/shell-output/SHA256SUMS.txt"
          if [ -z "$NEW_RELEASE_TAG" ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/shell-output/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            printf '%s\n' '## 无游戏空壳 / Game-free shell' '' '仅包含运行框架，不能直接安装游玩。不含游戏程序、游戏资源、转换后的游戏着色器、key 或存档。' '' '使用者须用自己的文件生成完整 IPA，再签名安装。资源 .data 保持外置、直接读取。' '' 'This archive is build input, not a playable IPA. Bring your own game files. Phone signing and gameplay validation of the shell path remain pending.' '' '说明 / Guide: docs/SHELL.zh-CN.md and docs/SHELL.md in the matching source tag.' > "$RUNNER_TEMP/release-notes.md"
            if [ -n "$RELEASE_NOTES" ]; then printf '\n%s\n' "$RELEASE_NOTES" >> "$RUNNER_TEMP/release-notes.md"; fi
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/shell-output/* --target "$(git rev-parse HEAD)" --prerelease --title "ACNH Mobile $RELEASE_TAG · 无游戏空壳" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
    permissions:
      contents: write
