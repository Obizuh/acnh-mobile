name: Withdraw v0.3.2 release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Return v0.3.2 to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v0.3.2 --draft=true
          gh release view v0.3.2 --json isDraft --jq '.isDraft' | grep -x true
